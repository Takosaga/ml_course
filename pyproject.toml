[project]
name = "ml-course"
version = "0.1.0"
description = "Structured learning path through mlcourse.ai — 10 topics from Pandas to gradient boosting"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.15",
    "jupyter>=1.0",
    "catboost>=1.2",
    "prophet>=1.1.5",
    "vowpalwabbit>=9.10",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.0",
]

[tool.uv]
# Run with: uv run <command>
# Install deps: uv sync
